name: rentalmobil
services:
  app:
    image: php:8.2-fpm
    container_name: rentalmobil_app
    working_dir: /var/www
    volumes:
      - /DATA/laravel/rentalmobil:/var/www
    command: >
      sh -c "if ! php -m | grep -q pdo_mysql; then docker-php-ext-install pdo pdo_mysql; fi;
             chmod -R 777 /var/www/storage /var/www/bootstrap/cache 2>/dev/null;
             php /var/www/artisan migrate --force 2>/dev/null;
             php /var/www/artisan db:seed --force 2>/dev/null;
             php /var/www/artisan storage:link 2>/dev/null;
             php-fpm"
    restart: unless-stopped
    networks:
      - casa-net

  web:
    image: nginx:alpine
    container_name: rentalmobil_web
    ports:
      - "8026:80"
    volumes:
      - /DATA/laravel/rentalmobil:/var/www
      - /DATA/laravel/rentalmobil/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - casa-net

networks:
  casa-net:
    external: true
